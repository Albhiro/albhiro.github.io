<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="description" content="Luis Alberto Oraa García - 16 años en Santander Digital Services. Full-stack developer, IA researcher, technical architect.">

    <!-- Stylesheets -->

            <div class="world-grid">

                <a href="cyberpunk.html" class="world-section" data-world="night-city">

                <a href="retro.html" class="world-section" data-world="arcade">
