                const line = systemLoadLines[currentLine];
                const isSuccess = line.includes('✓');

                let lineClass = '';
                if (isPrompt) lineClass = 'quantum-prompt';

                else if (isError) lineClass = 'error';
                
                lineDiv.innerHTML = `<span class="boot-line ${lineClass}">${line}</span>`;

                }, 200);
                
                // Activar el botón inmediatamente para acceso rápido del reclutador
                setTimeout(() => {
                    const initButton = document.getElementById('initButton');
                    if (initButton) {
                        initButton.classList.add('pulse-ready');
                        initButton.style.opacity = '1';
                        initButton.disabled = false;
                    }
                }, 300);
            }
        }
        
        // Iniciar el boot sequence inmediatamente
        setTimeout(addTerminalLine, 200);
        
        // Sistema reactivo de stats e indicadores
        let systemProgress = 0;
        const totalLines = systemLoadLines.length;
        
        // Referencias a elementos
        const experienceValue = document.querySelector('[data-target="16"]');
        const microservicesValue = document.querySelector('[data-target="500"]');
        const indicators = document.querySelectorAll('.indicator-light');
        const statRows = document.querySelectorAll('.stat-row');
        const systemIndicatorsDiv = document.querySelector('.system-indicators');
        
        // Función para actualizar stats dinámicamente
        function updateSystemStats(progress) {
            const percentage = (progress / totalLines) * 100;
            
            // Actualizar experiencia gradualmente
            if (experienceValue) {
                const experienceProgress = Math.floor((percentage / 100) * 16);
                experienceValue.textContent = experienceProgress;
            }
            
            // Actualizar microservicios gradualmente  
            if (microservicesValue) {
                const microservicesProgress = Math.floor((percentage / 100) * 500);
                microservicesValue.textContent = microservicesProgress;
            }
            
            // Activar indicadores progresivamente
            indicators.forEach((indicator, index) => {
                if (percentage > (index + 1) * 25) {
                    indicator.classList.add('active');
                    indicator.style.animationDelay = `${index * 0.5}s`;
                } else {
                    indicator.classList.remove('active');
                }
            });
            
            // Efecto de carga en stat-rows
            statRows.forEach((row, index) => {
                if (percentage > index * 20) {
                    row.style.opacity = '1';
                    row.style.transform = 'translateX(0)';
                    row.style.transition = 'all 0.5s ease';
                } else {
                    row.style.opacity = '0.3';
                    row.style.transform = 'translateX(-20px)';
                }
            });
            
            // Intensidad del sistema según progreso
            if (systemIndicatorsDiv) {
                const intensity = Math.min(percentage / 100, 1);
                systemIndicatorsDiv.style.boxShadow = `
                    0 0 ${25 * intensity}px rgba(0, 255, 136, ${0.15 * intensity}),
                    inset 0 0 15px rgba(0, 0, 0, 0.3)
                `;
                
                // Cambiar color de borde según progreso
                if (percentage < 25) {
                    systemIndicatorsDiv.style.borderColor = 'rgba(255, 165, 0, 0.3)'; // Naranja - Iniciando
                } else if (percentage < 50) {
                    systemIndicatorsDiv.style.borderColor = 'rgba(255, 255, 0, 0.3)'; // Amarillo - Cargando
                } else if (percentage < 75) {
                    systemIndicatorsDiv.style.borderColor = 'rgba(79, 195, 247, 0.3)'; // Azul - Progresando
                } else {
                    systemIndicatorsDiv.style.borderColor = 'rgba(0, 255, 136, 0.3)'; // Verde - Completando
                }
            }
            
            // Efecto de "overload" al completar
            if (percentage >= 95) {
                document.querySelectorAll('.stat-value').forEach(value => {
                    value.style.color = 'var(--color-neon-green)';
                    value.style.textShadow = `
                        0 0 10px rgba(0, 255, 136, 0.8),
                        0 0 20px rgba(0, 255, 136, 0.6),
                        0 0 30px rgba(0, 255, 136, 0.4)
                    `;
                });
            }
        }
        
        // Modificar la función addTerminalLine para incluir progreso
        const originalAddTerminalLine = addTerminalLine;
        window.addTerminalLine = function() {
            if (currentLine < systemLoadLines.length) {
                systemProgress = currentLine + 1;
                updateSystemStats(systemProgress);
                
                // Efecto de actualización en valores
                if (experienceValue) {
                    experienceValue.classList.add('updating');
                    setTimeout(() => experienceValue.classList.remove('updating'), 500);
                }
                if (microservicesValue) {
                    microservicesValue.classList.add('updating');
                    setTimeout(() => microservicesValue.classList.remove('updating'), 500);
                }
            }
            originalAddTerminalLine();
        };
        
        // Llamar a addTerminalLine en lugar de la función anónima
        addTerminalLine = window.addTerminalLine;
        
        // Botón de inicialización
        const initButton = document.getElementById('initButton');
        
        if (initButton) {
            initButton.addEventListener('click', function() {
                console.log('🏠 Iniciando transición al sistema...');
                
                // Activar overlay negro dramático
                const blackOverlay = document.getElementById('blackOverlay');
                if (blackOverlay) {
                    blackOverlay.classList.add('active');
                }
                
                // Efecto de sonido mental (vibración si está disponible)
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100, 50, 200]);
                }
                
                // Navegar después de la transición
                setTimeout(() => {
                    window.location.href = '/home';
                }, 1500); // 1.5 segundos para completar la transición
            });
        }
        
        // Navegación con data-route
        document.querySelectorAll('[data-route]').forEach(element => {
            element.addEventListener('click', function(e) {
                e.preventDefault();
                const route = this.getAttribute('data-route');
                const href = this.getAttribute('href');
                
                if (href && href !== '#') {
                    console.log(`🔗 Navegando a: ${href}`);
                    window.location.href = href;
                }
            });
        });
    });
    </script>

</body>
</html>
