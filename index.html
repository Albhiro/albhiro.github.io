        <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Landing page loaded - EPIC ANIMATIONS ENABLED');
            
            // ELEMENTOS DEL SISTEMA
            const terminalContent = document.getElementById('terminalContent');
            const initButton = document.getElementById('initButton');
            const experienceValue = document.querySelector('[data-target="16"]');
            const microservicesValue = document.querySelector('[data-target="500"]');
            const indicators = document.querySelectorAll('.indicator-light');
            const statRows = document.querySelectorAll('.stat-row');
            
            // CREAR BARRA DE PROGRESO
            const progressBar = document.createElement('div');
            progressBar.className = 'system-progress-bar';
            progressBar.innerHTML = '<div class="progress-fill"></div>';
            document.body.appendChild(progressBar);
            
            // CARGAR CONFIGURACIÓN DESDE JSON
            let bootLines = [];
            let terminalTitle = 'QUANTUM_INIT.exe';
            let finalPrompt = 'albhiro@quantum-universe:~$ ';
            let data = {}; // Variable global para acceso en coordinación
            
            // Función para cargar configuración
            async function loadConfig() {
                try {
                    const response = await fetch('./src/data/cv-data.json');
                    const config = await response.json();
                    data = config; // Asignar globalmente
                    
                    if (config.landing && config.landing.terminal) {
                        bootLines = config.landing.terminal.boot_sequence || [];
                        terminalTitle = config.landing.terminal.title || 'QUANTUM_INIT.exe';
                        finalPrompt = config.landing.terminal.final_prompt || 'alberto@santander:~$ ';
                        totalLines = bootLines.length; // Actualizar totalLines después de cargar
                        
                        // Actualizar título del terminal
                        const titleElement = document.querySelector('.terminal-title');
                        if (titleElement) {
                            titleElement.textContent = terminalTitle;
                        }
                        
                        // INICIALIZAR SISTEMA HÍBRIDO DE SERVICIOS
                        if (config.landing.terminal.service_coordination) {
                            const coordination = config.landing.terminal.service_coordination;
                            
                            // Programar arranque escalonado de LEDs (timing base)
                            Object.keys(coordination).forEach(serviceName => {
                                const serviceConfig = coordination[serviceName];
                                
                                setTimeout(() => {
                                    console.log(`⏰ TIMING BASE: Iniciando ${serviceName.toUpperCase()} después de ${serviceConfig.start_delay}ms`);
                                    startServiceLED(serviceName, serviceConfig);
                                }, serviceConfig.start_delay);
                            });
                        }
                    }
                } catch (error) {
                    console.warn('No se pudo cargar la configuración, usando valores por defecto');
                    // Fallback por si no se puede cargar el JSON
                    bootLines = [
                        'albhiro@quantum-universe:~$ sudo systemctl start architect.service',
                        'Oct 13 23:47:12 🚀 QUANTUM ARCHITECT SYSTEM INITIALIZING...',
                        'Oct 13 23:47:12 ✓ Core Systems: LOADED',
                        'Oct 13 23:47:12 ✓ Banking Experience: 15 YEARS VERIFIED',
                        'albhiro@quantum-universe:~$ systemctl status architect',
                        '● architect.service - Banking Architecture Specialist',
                        '   Status: "Ready for next challenge..."'
                    ];
                    totalLines = bootLines.length; // Actualizar totalLines para fallback también
                }
            }
            
            let currentLine = 0;
            let systemProgress = 0;
            let totalLines = 0; // Se actualizará cuando se cargue la configuración
            let isBootComplete = false; // Control para evitar bucles
            
            // VARIABLES PARA CONTROL DE TIEMPO TOTAL
            let totalLoadTime = 0; // Tiempo total de carga (2-5 segundos)
            let timePerLine = 0; // Tiempo promedio por línea
            let accumulatedTime = 0; // Tiempo acumulado
            
            // FUNCIÓN PARA SIMULAR BARRAS DE PROGRESO REALISTAS
            function animateProgressBar(targetProgress, duration) {
                const progressFill = document.querySelector('.progress-fill');
                if (!progressFill) return;
                
                const startProgress = parseFloat(progressFill.style.width || '0');
                const progressDiff = targetProgress - startProgress;
                const startTime = performance.now();
                
                function updateProgress(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easedProgress = progress * progress * (3 - 2 * progress); // Smooth easing
                    const currentProgress = startProgress + (progressDiff * easedProgress);
                    
                    progressFill.style.width = currentProgress + '%';
                    
                    if (progress < 1) {
                        requestAnimationFrame(updateProgress);
                    }
                }
                
                requestAnimationFrame(updateProgress);
            }
            
            // ACTUALIZAR STATS DINÁMICAMENTE CON ANIMACIÓN REALISTA
            function updateSystemStats(progress, delay = 2000) {
                const percentage = (progress / totalLines) * 100;
                
                // Animar barra de progreso de forma realista durante el delay
                animateProgressBar(percentage, delay * 0.8); // 80% del delay para la barra
                
                // Stats dinámicos
                if (experienceValue) {
                    const experienceProgress = Math.floor((percentage / 100) * 15);
                    experienceValue.textContent = experienceProgress;
                    experienceValue.style.color = percentage > 50 ? '#00ff88' : '#ffeb3b';
                }
                
                if (microservicesValue) {
                    const microservicesProgress = Math.floor((percentage / 100) * 500);
                    microservicesValue.textContent = microservicesProgress;
                    microservicesValue.style.color = percentage > 50 ? '#00ff88' : '#ffeb3b';
                }
                
                // SISTEMA HÍBRIDO DE COORDINACIÓN SERVICIOS
                const serviceStates = {
                    creatividad: { phase: 'idle', startTime: null, terminalTriggered: false },
                    innovacion: { phase: 'idle', startTime: null, terminalTriggered: false },
                    'problem-solver': { phase: 'idle', startTime: null, terminalTriggered: false },
                    arquitectura: { phase: 'idle', startTime: null, terminalTriggered: false }
                };
                
                // Función para iniciar LED con timing base
                function startServiceLED(serviceName, config) {
                    const indicator = document.querySelector(config.selector);
                    if (!indicator) return;
                    
                    const state = serviceStates[serviceName];
                    state.phase = 'error';
                    state.startTime = Date.now();
                    
                    console.log(`🔴 ${serviceName.toUpperCase()}: Iniciando fase ROJA (timing base)`);
                    indicator.className = 'indicator-light error';
                    
                    // Transición a PARPADEO
                    setTimeout(() => {
                        if (state.phase === 'error') { // Solo si no fue acelerado por terminal
                            state.phase = 'connecting';
                            console.log(`🟡 ${serviceName.toUpperCase()}: Fase PARPADEO (timing base)`);
                            indicator.className = 'indicator-light connecting';
                            
                            // Transición a VERDE
                            setTimeout(() => {
                                if (state.phase === 'connecting') { // Solo si no fue acelerado
                                    state.phase = 'active';
                                    console.log(`🟢 ${serviceName.toUpperCase()}: ACTIVO (timing base completado)`);
                                    indicator.className = 'indicator-light active';
                                }
                            }, config.led_phases.connecting);
                        }
                    }, config.led_phases.error);
                }
                
                // Función para acelerar LED cuando aparece línea terminal
                function accelerateServiceLED(serviceName, config) {
                    const indicator = document.querySelector(config.selector);
                    if (!indicator) return;
                    
                    const state = serviceStates[serviceName];
                    state.terminalTriggered = true;
                    
                    switch(state.phase) {
                        case 'idle':
                            // Arrancar secuencia completa acelerada
                            console.log(`⚡ ${serviceName.toUpperCase()}: Terminal trigger - Arranque RÁPIDO`);
                            state.phase = 'error';
                            indicator.className = 'indicator-light error';
                            setTimeout(() => {
                                state.phase = 'connecting';
                                indicator.className = 'indicator-light connecting';
                                setTimeout(() => {
                                    state.phase = 'active';
                                    console.log(`� ${serviceName.toUpperCase()}: ACTIVO (acelerado por terminal)`);
                                    indicator.className = 'indicator-light active';
                                }, 400); // Parpadeo rápido
                            }, 200); // Rojo rápido
                            break;
                            
                        case 'error':
                            // Saltar directo a parpadeo
                            console.log(`⚡ ${serviceName.toUpperCase()}: Terminal trigger - Saltando a PARPADEO`);
                            state.phase = 'connecting';
                            indicator.className = 'indicator-light connecting';
                            setTimeout(() => {
                                state.phase = 'active';
                                console.log(`🟢 ${serviceName.toUpperCase()}: ACTIVO (desde error)`);
                                indicator.className = 'indicator-light active';
                            }, 600);
                            break;
                            
                        case 'connecting':
                            // Saltar directo a verde
                            console.log(`⚡ ${serviceName.toUpperCase()}: Terminal trigger - Directo a VERDE`);
                            state.phase = 'active';
                            indicator.className = 'indicator-light active';
                            break;
                            
                        case 'active':
                            console.log(`✅ ${serviceName.toUpperCase()}: Ya está ACTIVO - sin cambios`);
                            break;
                    }
                }
                
                // COORDINACIÓN HÍBRIDA: Detectar líneas de servicios en terminal
                const currentBootLine = bootLines[progress - 1] || '';
                
                // Mapeo de servicios para detección exacta
                const serviceMap = {
                    'creatividad': 'CREATIVIDAD.service',
                    'innovacion': 'INNOVACION.service', 
                    'problem-solver': 'PROBLEM-SOLVER.service',
                    'arquitectura': 'ARQUITECTURA.service'
                };
                
                // Verificar triggers de terminal para cada servicio
                Object.keys(data.landing.terminal.service_coordination).forEach(serviceName => {
                    const config = data.landing.terminal.service_coordination[serviceName];
                    const servicePattern = serviceMap[serviceName];
                    
                    if (currentBootLine.includes(servicePattern)) {
                        console.log(`🎯 TERMINAL TRIGGER: Detectada línea "${servicePattern}"`);
                        accelerateServiceLED(serviceName, config);
                    }
                });
                
                // Efecto en stat-rows
                statRows.forEach((row, index) => {
                    if (percentage > index * 15) {
                        row.style.opacity = '1';
                        row.style.transform = 'translateX(0)';
                        row.style.borderLeft = '3px solid #00ff88';
                    }
                });
            }
            
            // FUNCIÓN PRINCIPAL DE ANIMACIÓN
            function addTerminalLine() {
                if (isBootComplete) return; // Evitar bucles
                
                if (currentLine < bootLines.length) {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'terminal-line';
                    lineDiv.style.opacity = '0';
                    
                    const line = bootLines[currentLine];
                    let className = '';
                    
                    if (line.includes('albhiro@quantum-universe:~$')) className = 'quantum-prompt';
                    else if (line.includes('✓') && line.includes('.service')) className = 'service-success';
                    else if (line.includes('✓')) className = 'success';
                    else if (line.includes('🚀') || line.includes('⚡')) className = 'highlight';
                    else if (line.includes('👨‍💻') || line.includes('╔') || line.includes('║')) className = 'epic';
                    else if (line.includes('●') && line.includes('loaded active running')) className = 'service-status';
                    else if (line.includes('●')) className = 'highlight';
                    else if (line.includes('📡') || line.includes('🔄') || line.includes('Loading') || line.includes('Connecting') || line.includes('Starting')) className = 'process';
                    else if (line.includes('🧠') || line.includes('☕') || line.includes('🔧')) className = 'special';
                    
                    lineDiv.innerHTML = `<span class="${className}">${line}</span>`;
                    
                    // Con column-reverse, prepend hace que aparezca abajo
                    terminalContent.insertBefore(lineDiv, terminalContent.firstChild);
                    
                    // Animación de aparición desde abajo
                    lineDiv.style.transform = 'translateY(20px)';
                    lineDiv.style.opacity = '0';
                    
                    setTimeout(() => {
                        lineDiv.style.opacity = '1';
                        lineDiv.style.transform = 'translateY(0)';
                        lineDiv.style.transition = 'all 0.3s ease-out';
                    }, 10);
                    
                    // Con column-reverse, scroll = 0 mantiene al fondo
                    setTimeout(() => {
                        terminalContent.scrollTop = 0;
                    }, 50);
                    
                    currentLine++;
                    
                    // CALCULAR DELAY DINÁMICO BASADO EN TIEMPO TOTAL DISTRIBUIDO
                    let nextDelay;
                    let variationFactor = 1.0; // Factor de variación según el tipo de línea
                    
                    if (line.includes('albhiro@quantum-universe:~$')) {
                        // Comandos: pausa más larga (como si el usuario escribiera)
                        variationFactor = 1.8;
                    } else if (line.includes('QUANTUM ARCHITECT') || line.includes('INITIALIZING')) {
                        // Mensajes épicos: pausa dramática
                        variationFactor = 2.0;
                    } else if (line.includes('Loading') || line.includes('Connecting') || line.includes('Starting')) {
                        // Procesos de carga: timing realista
                        variationFactor = 1.5;
                    } else if (line.includes('✓') && line.includes('.service')) {
                        // Servicios completándose: timing medio
                        variationFactor = 1.2;
                    } else if (line.includes('●') || line.includes('loaded active running')) {
                        // Status de servicios: más rápido
                        variationFactor = 0.8;
                    } else if (line.includes('🧠') || line.includes('☕') || line.includes('🔧')) {
                        // Mensajes especiales: pausa dramática máxima
                        variationFactor = 2.2;
                    } else if (line.includes('╔') || line.includes('║') || line.includes('╚')) {
                        // Box drawing: output directo, rápido
                        variationFactor = 0.6;
                    } else {
                        // Default: timing base
                        variationFactor = 1.0;
                    }
                    
                    // Calcular delay basado en tiempo distribuido con variación
                    nextDelay = Math.floor(timePerLine * variationFactor);
                    
                    // Añadir variación aleatoria ±20% para naturalidad
                    const randomVariation = (Math.random() - 0.5) * 0.4; // ±20%
                    nextDelay = Math.floor(nextDelay * (1 + randomVariation));
                    
                    // Log detallado para debugging
                    console.log(`⏱️ Línea ${currentLine}: "${line.substring(0, 50)}..." → Delay: ${nextDelay}ms (factor: ${variationFactor})`);
                    
                    // Mínimo de 100ms para evitar delays demasiado cortos
                    nextDelay = Math.max(100, nextDelay);
                    
                    // Actualizar tiempo acumulado
                    accumulatedTime += nextDelay;
                    
                    // Actualizar progreso con el delay calculado
                    systemProgress = currentLine;
                    updateSystemStats(systemProgress, nextDelay);
                    
                    setTimeout(addTerminalLine, nextDelay);
                } else {
                    // SECUENCIA COMPLETADA
                    isBootComplete = true; // Marcar como completado
                    
                    // Log del tiempo total real
                    console.log(`✅ Carga completada en ${accumulatedTime}ms (planificado: ${totalLoadTime}ms)`);
                    console.log(`📊 Diferencia: ${((accumulatedTime - totalLoadTime) / totalLoadTime * 100).toFixed(1)}%`);
                    
                    setTimeout(() => {
                        const cursorDiv = document.createElement('div');
                        cursorDiv.className = 'terminal-line';
                        cursorDiv.innerHTML = `<span class="quantum-prompt">${finalPrompt}<span class="cursor-blink">█</span></span>`;
                        // Con column-reverse, insertar al principio lo pone al final visual (abajo)
                        terminalContent.insertBefore(cursorDiv, terminalContent.firstChild);
                        terminalContent.scrollTop = 0;
                    }, 500);
                    
                    // HABILITAR BOTÓN CON EFECTO ÉPICO
                    setTimeout(() => {
                        if (initButton) {
                            initButton.style.opacity = '1';
                            initButton.style.transform = 'scale(1)';
                            initButton.style.transition = 'all 0.5s ease';
                            initButton.style.boxShadow = '0 0 30px rgba(0, 255, 136, 0.6)';
                            initButton.disabled = false;
                            
                            // Efecto de pulso
                            initButton.classList.add('pulse-ready');
                        }
                        
                        // Completar barra de progreso
                        updateProgressBar(100);
                        
                        // Efecto final en stats
                        document.querySelectorAll('.stat-value').forEach(value => {
                            value.style.color = '#00ff88';
                            value.style.textShadow = '0 0 10px rgba(0, 255, 136, 0.8)';
                        });
                        
                    }, 800);
                }
            }
            
            // OCULTAR BOTÓN INICIALMENTE
            if (initButton) {
                initButton.style.opacity = '0';
                initButton.style.transform = 'scale(0.8)';
                initButton.disabled = true;
                
                // Click handler
                initButton.addEventListener('click', function() {
                    const isLiveServer = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    const homeUrl = isLiveServer ? './home.html' : '/home';
                    window.location.href = homeUrl;
                });
            }
            
            // LIMPIAR TERMINAL Y PREPARAR PARA column-reverse
            if (terminalContent) {
                terminalContent.innerHTML = '';
                // Con column-reverse no necesitamos líneas vacías iniciales
                // El contenido aparecerá naturalmente desde abajo
            }
            
            // INICIALIZAR STATS EN 0
            if (experienceValue) experienceValue.textContent = '0';
            if (microservicesValue) microservicesValue.textContent = '0';
            
            // Inicializar indicadores de sistema en estado neutro (como router apagado)
            const indicatorLights = document.querySelectorAll('.indicator-light');
            indicatorLights.forEach(light => {
                light.className = 'indicator-light'; // Solo clase base, sin estados
            });
            
            // Ocultar stat-rows inicialmente
            statRows.forEach(row => {
                row.style.opacity = '0.3';
                row.style.transform = 'translateX(-20px)';
                row.style.transition = 'all 0.5s ease';
            });
            
            // INICIALIZAR SISTEMA COMPLETO
            async function initializeSystem() {
                await loadConfig();
                
                // CALCULAR TIEMPO TOTAL DE CARGA (2-5 segundos)
                totalLoadTime = Math.floor(Math.random() * (5000 - 2000 + 1)) + 2000;
                timePerLine = totalLoadTime / totalLines; // Tiempo promedio por línea
                
                console.log(`🎯 Tiempo total de carga: ${totalLoadTime}ms (${(totalLoadTime/1000).toFixed(1)}s)`);
                console.log(`🎯 Tiempo por línea: ${timePerLine.toFixed(0)}ms`);
                console.log(`🎯 Total líneas: ${totalLines}`);
                
                // INICIAR ANIMACIÓN DESPUÉS DE CARGAR CONFIGURACIÓN
                setTimeout(addTerminalLine, 800);
            }
            
            // Iniciar todo el sistema
            initializeSystem();
        });
        </script>

    </body>
