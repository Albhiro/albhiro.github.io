    <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Landing page loaded - AppController handles navigation');
        
        // Solo lógica del terminal, navegación manejada por AppController
        const terminalContent = document.getElementById('terminalContent');
        
        // Sistema simplificado de líneas de terminal
        const systemLoadLines = [
            'quantum@universe:~$ sudo systemctl start quantum-architect.service',
            '[  0.001] 🚀 QUANTUM ARCHITECT BOOT SEQUENCE INITIATED',
            '[  0.015] ✓ System Core - LOADED',
            '[  0.027] ✓ Memory: 64GB - INITIALIZED',
            '[  0.039] ✓ Storage: NVMe SSD - READY',
            '[  0.051] ✓ Network - CONNECTED',
            'quantum@universe:~$ docker ps --all',
            '[  0.089] ✓ Containers - HEALTHY',
            '[  0.123] ✓ Microservices - ACTIVE',
            '[  0.157] ✓ Databases - READY',
            'quantum@universe:~$ cat ~/.architect_profile',
            '[  0.189] 👨‍💻 Loading Architect Profile...',
            '[  0.221] ✓ Name: Alberto - Banco Santander [LOADED]',
            '[  0.253] ✓ Experience: 15 years [BANKING EXPERT]',
            '[  0.285] ✓ Skills: Legacy + Modern [HYBRID]',
            '[  0.317] ✓ Mainframe: IBM + COBOL [MASTER]',
            '[  0.349] ✓ Modern: Angular + Python [EXPERT]',
            'quantum@universe:~$ systemctl is-system-running',
            '[  0.381] 🎯 System State: RUNNING [OPTIMAL]',
            '[  0.413]  ARCHITECT SYSTEM: FULLY OPERATIONAL',
            '[  0.445] 💻 15 AÑOS BANCO SANTANDER: READY',
            '[  0.477] ✨ PORTFOLIO ACCESS: UNLOCKED',
            'quantum@universe:~$ whoami',
            '[  0.509] 👨‍💻 ALBERTO - BANKING ARCHITECT',
            '[  0.541] 🌟 STATUS: READY FOR ACCESS...'
        ];
        
        let currentLine = 0;
        
        // Función simple para agregar líneas del terminal
        function addTerminalLine() {
            if (currentLine < systemLoadLines.length) {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'terminal-line boot-line';
                
                const line = systemLoadLines[currentLine];
                const isPrompt = line.startsWith('quantum@universe:~$');
                const isSuccess = line.includes('✓');
                const isHighlight = line.includes('🚀') || line.includes('⚡');
                const isEpic = line.includes('👨‍💻') || line.includes('🌟');
                
                let lineClass = '';
                if (isPrompt) lineClass = 'quantum-prompt';
                else if (isEpic) lineClass = 'epic';
                else if (isSuccess) lineClass = 'success';
                else if (isWarning) lineClass = 'highlight';
                else if (isError) lineClass = 'error';
                
                lineDiv.innerHTML = `<span class="boot-line ${lineClass}">${line}</span>`;
                
                // Scroll dinámico realista - la nueva línea empuja las anteriores hacia arriba
                terminalContent.appendChild(lineDiv);
                currentLine++;
                
                // Scroll automático realista - nueva línea empuja las anteriores hacia arriba
                // Simula comportamiento de consola real donde cada nueva línea aparece al final
                // y las anteriores suben gradualmente
                setTimeout(() => {
                    terminalContent.scrollTop = terminalContent.scrollHeight;
                }, 10); // Micro delay para efecto más natural
                
                // Sistema de timing dinámico ultra-realista 
                let nextDelay;
                
                if (line.startsWith('quantum@universe:~$')) {
                    // Comandos: reducido para carga rápida total 3-4 segundos
                    nextDelay = getRandomDelay(80, 150);
                } else if (line.includes('🚀') || line.includes('QUANTUM ARCHITECT') || line.includes('FULLY OPERATIONAL')) {
                    // Mensajes épicos finales: timing reducido
                    nextDelay = getRandomDelay(100, 200);
                } else if (line.includes('Loading') || line.includes('initialization') || line.includes('STATUS')) {
                    // Procesos de carga: timing muy rápido
                    nextDelay = getRandomDelay(30, 60);
                } else if (line.includes('[') && (line.includes('✓') || line.includes('READY') || line.includes('OK'))) {
                    // Procesos internos del sistema: ultra rápidos
                    nextDelay = getRandomDelay(5, 15);
                } else if (line.includes('curl') || line.includes('systemctl') || line.includes('docker') || line.includes('kubectl')) {
                    // Respuestas de comandos del sistema: muy rápido
                    nextDelay = getRandomDelay(15, 40);
                } else if (line.includes('�‍💻') || line.includes('☕') || line.includes('🧠')) {
                    nextDelay = 600; // Mensajes personales más lentos
                } else if (line.includes('💡') || line.includes('🎮') || line.includes('🌟')) {
                    // Mensajes finales dramáticos: timing reducido pero notable
                    nextDelay = getRandomDelay(60, 120);
                } else {
                    // Líneas generales: ultra rápido
                    nextDelay = getRandomDelay(8, 25);
                }
                
                setTimeout(addTerminalLine, nextDelay);
            } else {
                // Terminó la secuencia de boot
                isBootComplete = true;
                
                // Agregar cursor parpadeante final para efecto realista de consola
                setTimeout(() => {
                    const cursorDiv = document.createElement('div');
                    cursorDiv.className = 'terminal-line boot-line';
                    cursorDiv.innerHTML = '<span class="boot-line quantum-prompt">quantum@universe:~$ <span class="cursor-blink">█</span></span>';
                    terminalContent.appendChild(cursorDiv);
                    terminalContent.scrollTop = terminalContent.scrollHeight;
                }, 200);
                
                // Activar el botón inmediatamente para acceso rápido del reclutador
                setTimeout(() => {
                    const initButton = document.getElementById('initButton');
                    if (initButton) {
                        initButton.classList.add('pulse-ready');
                        initButton.style.opacity = '1';
                        initButton.disabled = false;
                    }
                }, 300);
            }
        }
        
        // Iniciar el boot sequence inmediatamente
        setTimeout(addTerminalLine, 200);
        
        // Sistema reactivo de stats e indicadores
        let systemProgress = 0;
        const totalLines = systemLoadLines.length;
        
        // Referencias a elementos
        const experienceValue = document.querySelector('[data-target="16"]');
        const microservicesValue = document.querySelector('[data-target="500"]');
        const indicators = document.querySelectorAll('.indicator-light');
        const statRows = document.querySelectorAll('.stat-row');
        const systemIndicatorsDiv = document.querySelector('.system-indicators');
        
        // Función para actualizar stats dinámicamente
        function updateSystemStats(progress) {
            const percentage = (progress / totalLines) * 100;
            
            // Actualizar experiencia gradualmente
            if (experienceValue) {
                const experienceProgress = Math.floor((percentage / 100) * 16);
                experienceValue.textContent = experienceProgress;
            }
            
            // Actualizar microservicios gradualmente  
            if (microservicesValue) {
                const microservicesProgress = Math.floor((percentage / 100) * 500);
                microservicesValue.textContent = microservicesProgress;
            }
            
            // Activar indicadores progresivamente
            indicators.forEach((indicator, index) => {
                if (percentage > (index + 1) * 25) {
                    indicator.classList.add('active');
                    indicator.style.animationDelay = `${index * 0.5}s`;
                } else {
                    indicator.classList.remove('active');
                }
            });
            
            // Efecto de carga en stat-rows
            statRows.forEach((row, index) => {
                if (percentage > index * 20) {
                    row.style.opacity = '1';
                    row.style.transform = 'translateX(0)';
                    row.style.transition = 'all 0.5s ease';
                } else {
                    row.style.opacity = '0.3';
                    row.style.transform = 'translateX(-20px)';
                }
            });
            
            // Intensidad del sistema según progreso
            if (systemIndicatorsDiv) {
                const intensity = Math.min(percentage / 100, 1);
                systemIndicatorsDiv.style.boxShadow = `
                    0 0 ${25 * intensity}px rgba(0, 255, 136, ${0.15 * intensity}),
                    inset 0 0 15px rgba(0, 0, 0, 0.3)
                `;
                
                // Cambiar color de borde según progreso
                if (percentage < 25) {
                    systemIndicatorsDiv.style.borderColor = 'rgba(255, 165, 0, 0.3)'; // Naranja - Iniciando
                } else if (percentage < 50) {
                    systemIndicatorsDiv.style.borderColor = 'rgba(255, 255, 0, 0.3)'; // Amarillo - Cargando
                } else if (percentage < 75) {
                    systemIndicatorsDiv.style.borderColor = 'rgba(79, 195, 247, 0.3)'; // Azul - Progresando
                } else {
                    systemIndicatorsDiv.style.borderColor = 'rgba(0, 255, 136, 0.3)'; // Verde - Completando
                }
            }
            
            // Efecto de "overload" al completar
            if (percentage >= 95) {
                document.querySelectorAll('.stat-value').forEach(value => {
                    value.style.color = 'var(--color-neon-green)';
                    value.style.textShadow = `
                        0 0 10px rgba(0, 255, 136, 0.8),
                        0 0 20px rgba(0, 255, 136, 0.6),
                        0 0 30px rgba(0, 255, 136, 0.4)
                    `;
                });
            }
        }
        
        // Modificar la función addTerminalLine para incluir progreso
        const originalAddTerminalLine = addTerminalLine;
        window.addTerminalLine = function() {
            if (currentLine < systemLoadLines.length) {
                systemProgress = currentLine + 1;
                updateSystemStats(systemProgress);
                
                // Efecto de actualización en valores
                if (experienceValue) {
                    experienceValue.classList.add('updating');
                    setTimeout(() => experienceValue.classList.remove('updating'), 500);
                }
                if (microservicesValue) {
                    microservicesValue.classList.add('updating');
                    setTimeout(() => microservicesValue.classList.remove('updating'), 500);
                }
            }
            originalAddTerminalLine();
        };
        
        // Llamar a addTerminalLine en lugar de la función anónima
        addTerminalLine = window.addTerminalLine;
        
        // Botón de inicialización
        const initButton = document.getElementById('initButton');
        
        if (initButton) {
            initButton.addEventListener('click', function() {
                console.log('🏠 Iniciando transición al sistema...');
                
                // Activar overlay negro dramático
                const blackOverlay = document.getElementById('blackOverlay');
                if (blackOverlay) {
                    blackOverlay.classList.add('active');
                }
                
                // Efecto de sonido mental (vibración si está disponible)
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100, 50, 200]);
                }
                
                // Navegar después de la transición
                setTimeout(() => {
                    window.location.href = '/home';
                }, 1500); // 1.5 segundos para completar la transición
            });
        }
        
        // Navegación con data-route
        document.querySelectorAll('[data-route]').forEach(element => {
            element.addEventListener('click', function(e) {
                e.preventDefault();
                const route = this.getAttribute('data-route');
                const href = this.getAttribute('href');
                
                if (href && href !== '#') {
                    console.log(`🔗 Navegando a: ${href}`);
                    window.location.href = href;
                }
            });
        });
    });
