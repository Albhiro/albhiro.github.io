    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">

    <link rel="preload" href="./src/utils/quantum-engine.js" as="script">
    <link rel="preload" href="./assets/audio/system-boot.mp3" as="audio">
</head>
<body class="quantum-loading">
    
    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app-container">
        
        <!-- PÁGINA DE LANDING (INICIALIZACIÓN CUÁNTICA) -->
        <div id="landing-page">
            <!-- El contenido se carga desde landing.html -->
        </div>
        
        <!-- DASHBOARD PRINCIPAL (OCULTO INICIALMENTE) -->
        <div id="dashboard-page" class="quantum-dashboard" style="display: none; opacity: 0; transform: scale(0.95);">
            <!-- Aquí se cargará el dashboard cuando esté listo -->
            <div class="dashboard-placeholder">
                <h2 class="quantum-text">SISTEMA CUÁNTICO ACTIVADO</h2>
                <p>Dashboard en construcción...</p>
            </div>
        </div>
        
    </div>
    
    <!-- SCRIPTS MODULARES -->
    <script src="./src/utils/quantum-engine.js"></script>
    <script src="./src/scripts/js/landing.js"></script>
    
    <!-- INICIALIZACIÓN PRINCIPAL -->
    <script>
        /**
         * ===================================================================
         * SISTEMA DE INICIALIZACIÓN MODULAR
         * ===================================================================
         */
        
        'use strict';
        
        class QuantumApp {
            constructor() {
                this.quantumEngine = null;
                this.currentPage = 'landing';
                this.isInitialized = false;
                
                this.init();
            }
            
            async init() {
                console.log('🚀 Quantum App: Inicializando aplicación...');
                
                // Cargar contenido de la landing page
                await this.loadLandingPage();
                
                // Inicializar motor cuántico
                this.quantumEngine = new QuantumEngine();
                
                this.isInitialized = true;
                console.log('✅ Quantum App: Aplicación inicializada');
            }
            
            async loadLandingPage() {
                try {
                    const response = await fetch('./src/pages/landing.html');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const html = await response.text();
                    const landingContainer = document.getElementById('landing-page');
                    
                    if (landingContainer) {
                        landingContainer.innerHTML = html;
                        console.log('✅ Landing page cargada correctamente');
                    }
                } catch (error) {
                    console.error('❌ Error cargando landing page:', error);
                    
                    // Fallback: mostrar mensaje de error
                    const landingContainer = document.getElementById('landing-page');
                    if (landingContainer) {
                        landingContainer.innerHTML = `
                            <div class="error-fallback">
                                <h2>Error de carga</h2>
                                <p>No se pudo cargar la página de inicialización.</p>
                            </div>
                        `;
                    }
                }
            }
            
            transitionToPage(pageName) {
                console.log(`🔄 Transicionando a: ${pageName}`);
                this.currentPage = pageName;
                
                // Lógica de transición entre páginas
                const currentPageEl = document.getElementById(`${this.currentPage}-page`);
                const targetPageEl = document.getElementById(`${pageName}-page`);
                
                if (currentPageEl && targetPageEl) {
                    // Fade out página actual
                    currentPageEl.style.opacity = '0';
                    
                    setTimeout(() => {
                        currentPageEl.style.display = 'none';
                        targetPageEl.style.display = 'block';
                        
                        // Fade in nueva página
                        setTimeout(() => {
                            targetPageEl.style.opacity = '1';
                        }, 100);
                    }, 600);
                }
            }
        }
        
        // Inicializar aplicación cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.quantumApp = new QuantumApp();
            });
        } else {
            window.quantumApp = new QuantumApp();
        }
        
        // Debugging global
        window.addEventListener('error', (e) => {
            console.error('❌ Error global capturado:', e.error);
        });
        
        console.log('📋 Sistema modular cargado correctamente');
    </script>
</body>
</html>
