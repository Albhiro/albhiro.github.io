        'use strict';
        
        class QuantumApp {
            constructor() {
                this.quantumEngine = null;
                this.currentPage = 'landing';
                this.isInitialized = false;
                this.performanceManager = null;
                
                this.init();
            }
            
            async init() {
                console.log('🚀 Quantum App: Inicializando aplicación...');
                
                // Inicializar gestor de rendimiento
                if (window.PerformanceManager) {
                    this.performanceManager = new PerformanceManager();
                    console.log('✅ Performance Manager inicializado');
                }
                
                // Inicializar gestor de contenido dinámico
                if (window.DynamicContentManager) {
                    this.contentManager = new DynamicContentManager();
                    console.log('✅ Dynamic Content Manager inicializado');
                }
                
                // Cargar contenido de la landing page
                await this.loadLandingPage();
                
                // QuantumEngine se inicializa desde loadLandingPage()
                
                this.isInitialized = true;
                console.log('✅ Quantum App: Aplicación inicializada');
            }
            
            async loadLandingPage() {
                try {
                    const response = await fetch('./src/pages/landing.html');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const html = await response.text();
                    const landingContainer = document.getElementById('landing-page');
                    
                    if (landingContainer) {
                        landingContainer.innerHTML = html;
                        console.log('✅ Landing page cargada correctamente');
                        
                        // Esperar a que el content manager esté listo
                        if (this.contentManager && this.contentManager.initialized) {
                            this.setupDynamicContent();
                        } else {
                            // Reintentar cada 100ms hasta que esté listo
                            const waitForContentManager = () => {
                                if (this.contentManager && this.contentManager.initialized) {
                                    this.setupDynamicContent();
                                } else {
                                    setTimeout(waitForContentManager, 100);
                                }
                            };
                            waitForContentManager();
                        }
                    }
                } catch (error) {
                    console.error('❌ Error cargando landing page:', error);
                    
                    // Fallback: mostrar mensaje de error
                    const landingContainer = document.getElementById('landing-page');
                    if (landingContainer) {
                        landingContainer.innerHTML = `
                            <div class="error-fallback">
                                <h2>Error de carga</h2>
                                <p>No se pudo cargar la página de inicialización.</p>
                            </div>
                        `;
                    }
                }
            }
            
            setupDynamicContent() {
                console.log('🎨 Configurando contenido dinámico...');
                
                // Reemplazar textos estáticos con datos JSON
                this.contentManager.replaceTextContent();
                
                // Generar navegación
                this.contentManager.generateSection('navigation-menu', '.nav-menu[data-dynamic="navigation-menu"]');
                
                // Generar indicadores de sistema dinámicamente
                this.contentManager.generateSection('landing-indicators', '.system-indicators[data-dynamic="landing-indicators"]');
                
                // Inicializar sistema cuántico después del contenido dinámico
                if (window.QuantumEngine) {
                    window.quantumEngine = new QuantumEngine();
                    window.quantumEngine.init();
                    console.log('✅ QuantumEngine inicializado correctamente');
                } else {
                    console.error('❌ QuantumEngine no disponible');
                }
            }
            
            async loadPage(pageId) {
                console.log(`📄 Cargando página: ${pageId}`);
                
                // Si es la landing, mostrar página original y ocultar navegación
                if (pageId === 'landing') {
                    this.showLandingPage();
                    return;
                }
                
                // Verificar si la página ya está cargada
                const pageContainer = document.getElementById(`${pageId}-page`);
                if (!pageContainer) {
                    console.error(`❌ Container no encontrado para: ${pageId}`);
                    return;
                }
                
                // Si no tiene contenido, cargar
                if (!pageContainer.innerHTML.trim()) {
                    await this.loadPageContent(pageId);
                }
                
                // Mostrar página
                this.showPage(pageId);
            }
            
            async loadPageContent(pageId) {
                const pageContainer = document.getElementById(`${pageId}-page`);
                
                try {
                    console.log(`🔄 Iniciando carga de ${pageId}...`);
                    
                    // Mostrar loading
                    pageContainer.innerHTML = `
                        <div class="page-loading">
                            <div class="loading-spinner"></div>
                            <div class="loading-text">Cargando ${pageId}...</div>
                        </div>
                    `;
                    
                    // Cargar recursos (CSS/JS) con Performance Manager
                    if (this.performanceManager) {
                        console.log(`📦 Cargando recursos CSS para ${pageId}...`);
                        await this.performanceManager.loadPageResources(pageId);
                    }
                    
                    // Generar contenido HTML específico de la página
                    console.log(`🎨 Generando HTML para ${pageId}...`);
                    const html = this.generatePageHTML(pageId);
                    
                    if (html && html.length > 100) {
                        pageContainer.innerHTML = html;
                        console.log(`✅ HTML de ${pageId} insertado (${html.length} caracteres)`);
                        
                        // Pequeña pausa para que el DOM se actualice
                        setTimeout(() => {
                            // Generar contenido dinámico específico de la página
                            this.generatePageContent(pageId);
                        }, 50);
                    } else {
                        throw new Error(`HTML vacío o muy corto para ${pageId}`);
                    }
                    
                    console.log(`✅ Página ${pageId} cargada correctamente`);
                    
                } catch (error) {
                    console.error(`❌ Error cargando página ${pageId}:`, error);
                    pageContainer.innerHTML = `
                        <div class="page-loading">
                            <div class="loading-text">Error cargando ${pageId}: ${error.message}</div>
                        </div>
                    `;
                }

                                    </div>
                                    
                                    <div class="form-field">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-input" placeholder="tu@email.com">
                                    </div>
                                    
                                    <div class="form-field">
                                        <label class="form-label">Asunto</label>
                                        <input type="text" class="form-input" placeholder="¿De qué quieres hablar?">
                                    </div>
                                    
                                    <div class="form-field">
                                        <label class="form-label">Mensaje</label>
                                        <textarea class="form-textarea" placeholder="Cuéntame sobre tu proyecto imposible..."></textarea>
                                    </div>
                                    
                                    <button type="submit" class="form-submit">Enviar Mensaje</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="connection-lines">
                            <div class="connection-line"></div>
                            <div class="connection-line"></div>
                        </div>
                    `
                };
                
                return pageTemplates[pageId] || '<div>Página no encontrada</div>';
            }
            
            generatePageContent(pageId) {
                console.log(`🎨 Generando contenido para: ${pageId}`);
                
                // El contenido ya está generado en generatePageHTML
                // Solo necesitamos activar interactividad si es necesario
                switch(pageId) {
                    case 'portfolio':
                        console.log('📁 Activando filtros de portfolio...');
                        this.activatePortfolioFilters();
                        break;
                        
                    case 'contact':
                        console.log('📞 Activando formulario de contacto...');
                        this.activateContactForm();
                        break;
                }
                
                console.log(`✅ Contenido de ${pageId} listo`);
            }
            
            activatePortfolioFilters() {
                const filterBtns = document.querySelectorAll('.filter-btn');
                const projectCards = document.querySelectorAll('.project-card');
                
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        // Remover active de todos
                        filterBtns.forEach(b => b.classList.remove('active'));
                        // Activar el clickeado
                        btn.classList.add('active');
                        
                        const filter = btn.getAttribute('data-filter');
                        console.log(`� Filtrando por: ${filter}`);
                        
                        // Por ahora mostrar todos (se puede implementar filtro real después)
                        projectCards.forEach(card => {
                            card.style.display = 'block';
                        });
                    });
                });
            }
            
            activateContactForm() {
                const form = document.querySelector('.form-submit');
                if (form) {
                    form.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('¡Gracias por tu interés! El formulario se implementará próximamente.');
                        console.log('📧 Formulario activado');
                    });
                }
            }
            
            showPage(pageId) {
                // Ocultar todas las páginas
                document.querySelectorAll('.page-container').forEach(page => {
                    page.classList.remove('active');
                });
                
                // Mostrar página solicitada
                const targetPage = document.getElementById(`${pageId}-page`);
                if (targetPage) {
                    targetPage.classList.add('active');
                    
                    // Mostrar navegación si no es landing
                    const nav = document.getElementById('main-navigation');
                    if (pageId !== 'landing') {
                        nav.style.display = 'block';
                    } else {
                        nav.style.display = 'none';
                    }
                    
                    // Actualizar estado de navegación
                    if (window.cvRouter) {
                        window.cvRouter.updateNavigationState(pageId);
                    }
                    
                    // Activar animaciones de la página visible
                    if (this.performanceManager) {
                        this.performanceManager.activatePageAnimations(`${pageId}-page`);
                    }
                }
                
                this.currentPage = pageId;
            }
            
            showLandingPage() {
                // Ocultar todas las páginas
                document.querySelectorAll('.page-container').forEach(page => {
                    page.classList.remove('active');
                });
                
                // Mostrar página landing
                const landingPage = document.getElementById('landing-page');
                if (landingPage) {
                    landingPage.classList.add('active');
                }
                
                // Ocultar navegación
                const nav = document.getElementById('main-navigation');
                if (nav) {
                    nav.style.display = 'none';
                }
                
                // Mostrar elementos originales del landing
                const dashboard = document.querySelector('.quantum-dashboard');
                const initContainer = document.querySelector('.quantum-init-container');
                
                if (dashboard) {
                    dashboard.style.display = 'block';
                    dashboard.style.opacity = '1';
                }
                
                this.currentPage = 'landing';
                console.log('🏠 Regresando al landing original');
            }
            
            transitionToPage(pageName) {
                console.log(`🔄 Transicionando a: ${pageName}`);
                this.currentPage = pageName;
                
                // Lógica de transición entre páginas
                const currentPageEl = document.getElementById(`${this.currentPage}-page`);
                const targetPageEl = document.getElementById(`${pageName}-page`);
                
                if (currentPageEl && targetPageEl) {
                    // Fade out página actual
                    currentPageEl.style.opacity = '0';
                    
                    setTimeout(() => {
                        currentPageEl.style.display = 'none';
                        targetPageEl.style.display = 'block';
                        
                        // Fade in nueva página
                        setTimeout(() => {
                            targetPageEl.style.opacity = '1';
                        }, 100);
                    }, 600);
                }
            }
        }
        
        // Inicializar aplicación cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initializeApp();
            });
        } else {
            initializeApp();
        }
        
        function initializeApp() {
            // Inicializar Router
            window.cvRouter = new CVRouter();
            
            // Inicializar QuantumApp
            window.quantumApp = new QuantumApp();
            
            // Conectar Router con QuantumApp
            window.cvRouter.setQuantumApp(window.quantumApp);
            
            console.log('🚀 Sistema completo inicializado');
        }
        
        // Debugging global
        window.addEventListener('error', (e) => {
            console.error('❌ Error global capturado:', e.error);
        });
        
        console.log('📋 Sistema modular cargado correctamente');
        
        // Debug helper global
        window.debugCV = {
            testNavigation: () => {
                console.log('🧪 Probando navegación simple...');
                setTimeout(() => window.cvRouter.navigateTo('/portfolio'), 1000);
                setTimeout(() => window.cvRouter.navigateTo('/experience'), 3000);
                setTimeout(() => window.cvRouter.navigateTo('/skills'), 5000);
                setTimeout(() => window.cvRouter.navigateTo('/contact'), 7000);
                setTimeout(() => window.cvRouter.navigateTo('/'), 9000);
            },
            
            checkPages: () => {
                const pages = ['landing', 'portfolio', 'experience', 'skills', 'contact'];
                pages.forEach(page => {
                    const container = document.getElementById(`${page}-page`);
                    const hasContent = container && container.innerHTML.trim().length > 0;
                    console.log(`📋 ${page}: ${container ? 'Existe' : 'No existe'} - Visible: ${container?.classList.contains('active')} - Contenido: ${hasContent ? 'Sí' : 'No'}`);
                });
            },
            
            forceLoadPortfolio: () => {
                console.log('🔨 Forzando carga de portfolio...');
                window.quantumApp.loadPage('portfolio');
            }
        };
        
        // Navegación con data-route para archivos físicos
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-route]').forEach(element => {
                element.addEventListener('click', function(e) {
                    e.preventDefault();
                    const route = this.getAttribute('data-route');
                    const href = this.getAttribute('href');
                    
                    if (href && href !== '#') {
                        console.log(`🔗 Navegando a: ${href}`);
                        window.location.href = href;
                    }
                });
            });
        });
    </script>
</body>
</html>
