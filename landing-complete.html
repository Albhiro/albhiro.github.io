    <!-- Scripts específicos de Landing -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Landing page loaded');
        
        // Simulación de terminal
        const terminalContent = document.getElementById('terminalContent');
        const terminalLines = [
            '> Cargando matriz de habilidades...',
            '> Inicializando microservicios [████████████] 100%',
            '> Conectando con la dimensión cuántica...',
            '> Arquitecto Luis Alberto Oraa cargado exitosamente',
            '> Status: LISTO PARA MISIONES IMPOSIBLES',
            '> Esperando instrucciones...'
        ];
        
        let currentLine = 0;
        
        function addTerminalLine() {
            if (currentLine < terminalLines.length) {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'terminal-line';
                lineDiv.innerHTML = `
                    <span class="prompt">quantum@universe:~$</span>
                    <span class="command">${terminalLines[currentLine]}</span>
                `;
                terminalContent.appendChild(lineDiv);
                currentLine++;
                
                // Scroll automático
                terminalContent.scrollTop = terminalContent.scrollHeight;
                
                setTimeout(addTerminalLine, 1500);
            }
        }
        
        // Iniciar terminal después de un delay
        setTimeout(addTerminalLine, 2000);
        
        // Animación de números
        const numberElements = document.querySelectorAll('.typing-number');
        
        numberElements.forEach(element => {
            const target = parseInt(element.getAttribute('data-target'));
            let current = 0;
            const increment = target / 50;
            
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    element.textContent = target;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(current);
                }
            }, 50);
        });
        
        // Botón de inicialización
        const initButton = document.getElementById('initButton');
        
        if (initButton) {
            initButton.addEventListener('click', function() {
                console.log('🔗 Navegando al portfolio principal');
                window.location.href = './index.html';
            });
        }
        
        // Navegación con data-route
        document.querySelectorAll('[data-route]').forEach(element => {
            element.addEventListener('click', function(e) {
                e.preventDefault();
                const route = this.getAttribute('data-route');
                const href = this.getAttribute('href');
                
                if (href && href !== '#') {
                    console.log(`🔗 Navegando a: ${href}`);
                    window.location.href = href;
                }
            });
        });
    });
    </script>
