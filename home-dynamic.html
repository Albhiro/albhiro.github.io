<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamic-title"><!-- Cargado dinámicamente --></title>
    
    <!-- Meta Tags Dinámicos (cargados por JavaScript) -->

    <meta id="dynamic-keywords" name="keywords" content="">
    <meta name="author" content="Alberto - Banco Santander">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph dinámico -->
    <meta id="og-title" property="og:title" content="">
    <meta id="og-description" property="og:description" content="">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/images/og-preview.jpg">
    
    <!-- Twitter Card dinámico -->
    <meta name="twitter:card" content="summary_large_image">
    <meta id="twitter-title" name="twitter:title" content="">
    <meta id="twitter-description" name="twitter:description" content="">
    
    <!-- Canonical URL para SEO -->
    <link rel="canonical" href="https://albhiro.github.io">
    
    <!-- Preconnections para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- ESTILOS MODULARES -->
    <link href="./src/utils/common.css" rel="stylesheet">
    <link href="./src/assets/css/performance.css" rel="stylesheet">
    <link href="./src/assets/css/navigation.css" rel="stylesheet">
    <link href="./src/assets/css/landing.css" rel="stylesheet">
    <link href="./src/css/main.css" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
</head>
<body>
    <!-- NAVEGACIÓN PRINCIPAL -->
    <nav class="quantum-nav">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="/home" data-route="home">ALBERTO</a>
            </div>
            
            <div class="nav-menu">
                <a href="/home" data-route="home" class="nav-link active">INICIO</a>
                <a href="/portfolio" data-route="portfolio" class="nav-link">PORTFOLIO</a>
                <a href="/experience" data-route="experience" class="nav-link">EXPERIENCIA</a>
                <a href="/skills" data-route="skills" class="nav-link">SKILLS</a>
                <a href="/contact" data-route="contact" class="nav-link">CONTACTO</a>
            </div>
            
            <div class="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <!-- QUANTUM EFFECTS -->
            <div class="nav-quantum-effects">
                <div class="quantum-dot"></div>
                <div class="quantum-dot"></div>
                <div class="quantum-dot"></div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="home-container">
        <!-- HERO SECTION -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title" id="heroTitle">
                    <!-- Cargado dinámicamente -->
                </h1>
                <h2 class="hero-subtitle" id="heroSubtitle">
                    <!-- Cargado dinámicamente -->
                </h2>
                <p class="hero-description" id="heroDescription">
                    <!-- Cargado dinámicamente -->
                </p>
                
                <!-- STATS PRINCIPALES -->
                <div class="hero-stats" id="heroStats">
                    <!-- Cargado dinámicamente -->
                </div>
                
                <!-- CALL TO ACTION -->
                <div class="hero-actions" id="heroActions">
                    <!-- Cargado dinámicamente -->
                </div>
            </div>
            
            <!-- VISUAL ELEMENTS -->
            <div class="hero-visual">
                <div class="floating-code" id="floatingCode">
                    <!-- Cargado dinámicamente -->
                </div>
            </div>
        </section>
        
        <!-- SERVICIOS PRINCIPALES -->
        <section class="services-section">
            <div class="section-header">
                <h3 class="section-title" id="servicesTitle"><!-- Cargado dinámicamente --></h3>
                <p class="section-subtitle" id="servicesSubtitle"><!-- Cargado dinámicamente --></p>
            </div>
            
            <div class="services-grid" id="servicesGrid">
                <!-- Cargado dinámicamente -->
            </div>
        </section>
        
        <!-- TECNOLOGÍAS -->
        <section class="tech-section">
            <div class="section-header">
                <h3 class="section-title" id="techTitle"><!-- Cargado dinámicamente --></h3>
                <p class="section-subtitle" id="techSubtitle"><!-- Cargado dinámicamente --></p>
            </div>
            
            <div class="tech-categories" id="techCategories">
                <!-- Cargado dinámicamente -->
            </div>
        </section>
    </main>

    <!-- SCRIPTS -->
    <script src="./src/utils/app-controller.js"></script>
    <script src="./src/utils/smart-router.js"></script>
    <script>
    // SISTEMA DE CARGA DINÁMICA DESDE JSON
    document.addEventListener('DOMContentLoaded', async function() {
        console.log('🏠 Cargando Homepage desde JSON...');
        
        try {
            // Cargar datos del JSON
            const response = await fetch('./src/data/cv-data.json');
            const data = await response.json();
            const homeData = data.home;
            
            // Cargar meta información
            loadMetaData(homeData.meta);
            
            // Cargar hero section
            loadHeroSection(homeData.hero);
            
            // Cargar servicios
            loadServicesSection(homeData.services);
            
            // Cargar tecnologías
            loadTechnologiesSection(homeData.technologies);
            
            // Inicializar animaciones
            initializeAnimations();
            
            console.log('✅ Homepage cargada exitosamente desde JSON');
            
        } catch (error) {
            console.error('❌ Error cargando datos del JSON:', error);
            // Fallback básico
            document.getElementById('heroTitle').innerHTML = `
                <span class="title-line-1">ALBERTO</span>
                <span class="title-line-2">BANCO SANTANDER</span>
            `;
        }
    });
    
    // Función para cargar meta información
    function loadMetaData(metaData) {
        document.title = metaData.title;
        document.getElementById('dynamic-description').content = metaData.description;
        document.getElementById('dynamic-keywords').content = metaData.keywords;
        document.getElementById('og-title').content = metaData.og_title;
        document.getElementById('og-description').content = metaData.og_description;
        document.getElementById('twitter-title').content = metaData.twitter_title;
        document.getElementById('twitter-description').content = metaData.twitter_description;
    }
    
    // Función para cargar hero section
    function loadHeroSection(heroData) {
        // Título
        document.getElementById('heroTitle').innerHTML = `
            <span class="title-line-1">${heroData.title.line1}</span>
            <span class="title-line-2">${heroData.title.line2}</span>
        `;
        
        // Subtítulo
        document.getElementById('heroSubtitle').innerHTML = heroData.subtitle;
        
        // Descripción
        document.getElementById('heroDescription').innerHTML = heroData.description;
        
        // Stats
        const statsHTML = heroData.stats.map(stat => `
            <div class="stat-item">
                <div class="stat-value">${stat.value}</div>
                <div class="stat-label">${stat.label}</div>
            </div>
        `).join('');
        document.getElementById('heroStats').innerHTML = statsHTML;
        
        // Botones CTA
        const buttonsHTML = heroData.cta_buttons.map(button => `
            <a href="#" data-route="${button.route}" class="cta-button ${button.type}">
                <span>${button.text}</span>
                <i class="${button.icon}"></i>
            </a>
        `).join('');
        document.getElementById('heroActions').innerHTML = buttonsHTML;
        
        // Código flotante
        const codeHTML = heroData.floating_code.map(line => `
            <div class="code-line">${line.replace(/    /g, '&nbsp;&nbsp;&nbsp;&nbsp;')}</div>
        `).join('');
        document.getElementById('floatingCode').innerHTML = codeHTML;
    }
    
    // Función para cargar servicios
    function loadServicesSection(servicesData) {
        document.getElementById('servicesTitle').textContent = servicesData.section_title;
        document.getElementById('servicesSubtitle').textContent = servicesData.section_subtitle;
        
        const servicesHTML = servicesData.items.map(service => `
            <div class="service-card">
                <div class="service-icon">${service.icon}</div>
                <h4 class="service-title">${service.title}</h4>
                <p class="service-description">${service.description}</p>
            </div>
        `).join('');
        document.getElementById('servicesGrid').innerHTML = servicesHTML;
    }
    
    // Función para cargar tecnologías
    function loadTechnologiesSection(techData) {
        document.getElementById('techTitle').textContent = techData.section_title;
        document.getElementById('techSubtitle').textContent = techData.section_subtitle;
        
        const categoriesHTML = techData.categories.map(category => `
            <div class="tech-category">
                <h4 class="tech-category-title">${category.title}</h4>
                <div class="tech-tags">
                    ${category.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('')}
                </div>
            </div>
        `).join('');
        document.getElementById('techCategories').innerHTML = categoriesHTML;
    }
    
    // Función para inicializar animaciones
    function initializeAnimations() {
        const observerOptions = {
            threshold: 0.5,
            rootMargin: '0px 0px -100px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate');
                }
            });
        }, observerOptions);
        
        // Observar elementos animables
        document.querySelectorAll('.stat-item, .service-card, .tech-category').forEach(el => {
            observer.observe(el);
        });
    }
    </script>

    <!-- CSS PARA HOMEPAGE -->

    .home-container {
        min-height: 100vh;
        padding-top: var(--nav-height);
        background: var(--bg-gradient-main);
    }

        min-height: 90vh;

        align-items: center;
        padding: var(--space-xl) var(--space-lg);
        max-width: 1200px;
        margin: 0 auto;
        gap: var(--space-xxl);
    }
    
    .hero-content {

    }

        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
        margin-bottom: var(--space-lg);
    }
    
    .title-line-1 {

        color: var(--color-neon-blue);
        text-shadow: 0 0 20px var(--color-neon-blue);
    }
    
    .title-line-2 {
        display: block;
        color: var(--color-accent);
        text-shadow: 0 0 20px var(--color-accent);
    }
    
    .hero-subtitle {
        font-family: var(--font-display);
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        color: var(--color-text-light);
        margin-bottom: var(--space-lg);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .highlight {
        color: var(--color-success);
        text-shadow: 0 0 10px var(--color-success);
    }
    
    .hero-description {
        font-size: 1.2rem;
        color: var(--color-text-light);
        line-height: 1.6;
        margin-bottom: var(--space-xl);
        opacity: 0.9;
    }
    
    .hero-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: var(--space-lg);
        margin-bottom: var(--space-xl);
    }
    
    .stat-item {
        text-align: center;
        padding: var(--space-md);
        background: rgba(79, 195, 247, 0.05);
        border: 1px solid rgba(79, 195, 247, 0.2);
        border-radius: var(--border-radius);
        transition: all 0.3s var(--ease-smooth);
    }
    
    .stat-item:hover {
        border-color: var(--color-neon-blue);
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    
    .stat-value {
        font-family: var(--font-display);
        font-size: 2rem;
        color: var(--color-neon-blue);
        display: block;
        margin-bottom: var(--space-xs);
    }
    
    .stat-label {
        font-size: 0.8rem;
        color: var(--color-text-light);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .hero-actions {
        display: flex;
        gap: var(--space-lg);
        flex-wrap: wrap;
    }
    
    .cta-button {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-md) var(--space-xl);
        border-radius: var(--border-radius);
        text-decoration: none;
        font-family: var(--font-display);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.3s var(--ease-smooth);
        position: relative;
        overflow: hidden;
    }
    
    .cta-button.primary {
        background: linear-gradient(135deg, var(--color-neon-blue), var(--color-accent));
        color: var(--color-bg);
        border: 2px solid transparent;
    }
    
    .cta-button.secondary {
        background: transparent;
        color: var(--color-neon-blue);
        border: 2px solid var(--color-neon-blue);
    }
    
    .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    
    .hero-visual {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .floating-code {
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid var(--color-neon-blue);
        border-radius: var(--border-radius);
        padding: var(--space-lg);
        font-family: var(--font-mono);
        color: var(--color-success);
        font-size: 0.9rem;
        line-height: 1.5;
        animation: float 6s ease-in-out infinite;
        box-shadow: 0 0 30px rgba(79, 195, 247, 0.3);
    }
    
    .code-line {
        margin-bottom: var(--space-xs);
    }
    
    .services-section,
    .tech-section {
        padding: var(--space-xxl) var(--space-lg);
        max-width: 1200px;
        margin: 0 auto;
    }
    
    .section-header {
        text-align: center;
        margin-bottom: var(--space-xxl);
    }
    
    .section-title {
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        color: var(--color-neon-blue);
        margin-bottom: var(--space-md);
        text-transform: uppercase;

    }
    
    .services-grid {

        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--space-lg);
    }
    
    .service-card {
        background: rgba(79, 195, 247, 0.05);
        border: 1px solid rgba(79, 195, 247, 0.2);
        border-radius: var(--border-radius);
        padding: var(--space-xl);
        text-align: center;
        transition: all 0.3s var(--ease-smooth);
    }
    
    .service-card:hover {
        border-color: var(--color-neon-blue);
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }
    
    .service-icon {
        font-size: 3rem;
        margin-bottom: var(--space-lg);
    }
    
    .service-title {
        font-family: var(--font-display);
        font-size: 1.3rem;
        color: var(--color-text);
        margin-bottom: var(--space-md);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .service-description {
        color: var(--color-text-light);
        line-height: 1.6;
    }
    
    .tech-categories {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: var(--space-xl);
    }
    
    .tech-category {
        text-align: center;
    }
    
    .tech-category-title {
        font-family: var(--font-display);
        font-size: 1.2rem;
        color: var(--color-neon-blue);
        margin-bottom: var(--space-lg);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .tech-tags {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        justify-content: center;
    }
    
    .tech-tag {
        background: rgba(79, 195, 247, 0.1);
        color: var(--color-neon-blue);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--border-radius);
        font-family: var(--font-mono);
        font-size: 0.9rem;
        border: 1px solid rgba(79, 195, 247, 0.3);
        transition: all 0.3s var(--ease-smooth);
    }
    
    .tech-tag:hover {
        background: rgba(79, 195, 247, 0.2);
        border-color: var(--color-neon-blue);
        transform: translateY(-2px);
    }
    
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }
    
    @media (max-width: 768px) {
        .hero-section {
            flex-direction: column;
            text-align: center;
            min-height: 100vh;
        }
        
        .hero-stats {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .hero-actions {
            justify-content: center;
        }
        
        .services-grid {
            grid-template-columns: 1fr;
        }
        
        .tech-categories {
            grid-template-columns: 1fr;
        }
    }
    </style>

</body>
